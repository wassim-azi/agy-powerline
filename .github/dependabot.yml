version: 2
updates:
  # Dependency PRs go to main, like every other contribution, with
  # Conventional Commit messages ("chore(deps): bump ..." for npm,
  # "ci(deps): bump ..." for GitHub Actions). A new version is
  # proposed only after 7 days, so a compromised release has time to be
  # caught and pulled first.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Minor and patch updates of the dev tools come as one PR; a major
    # version gets its own, since it can need config changes.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    # All action updates in one monthly PR.
    groups:
      actions:
        patterns: ["*"]

  # The Codespaces / Dev Container image (.devcontainer/devcontainer.json).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
