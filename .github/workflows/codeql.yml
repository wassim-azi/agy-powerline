name: CodeQL

# CodeQL static analysis: scans JavaScript/Node code for security vulnerabilities,
# injection flaws, and path traversal. Results appear in the Security tab and
# satisfy OpenSSF Scorecard's SAST check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run once a week on Wednesdays at 14:00 UTC
    - cron: "0 14 * * 3"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # findings appear in the Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
