name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit. Each
# push to develop or main gets a group of its own, so those always run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Verify zero runtime dependencies
        run: |
          node -e "
            const deps = Object.keys(require('./package.json').dependencies || {});
            if (deps.length) throw new Error('Runtime dependencies are not allowed: ' + deps.join(', '));
          "

      - name: Run shared cross-platform tests
        run: npm run test:shared

      - name: Run OS-specific native tests
        run: npm run test:platform

      # Antigravity runs the bar with `cmd /c <statusLine.command>`. This runs
      # the command init wrote from the runner's own cmd, not through Node, in
      # a home path with a space in it. cmd only fails a step on its last
      # command, so each line exits on its own failure.
      - name: Smoke-test the cmd launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "HOME=%RUNNER_TEMP%\agy home"
          set "USERPROFILE=%RUNNER_TEMP%\agy home"
          set "AGY_POWERLINE_HOME="
          node src\index.js init --yes || exit /b 1
          for /f "usebackq delims=" %%c in (`node -p "require(process.env.USERPROFILE + '/.gemini/antigravity-cli/settings.json').statusLine.command"`) do set "BAR=%%c"
          echo statusLine.command: %BAR%
          echo {"model":{"display_name":"Gemini"}} | cmd /c "%BAR%" > "%RUNNER_TEMP%\bar.txt" 2> "%RUNNER_TEMP%\bar.err" || (type "%RUNNER_TEMP%\bar.err" & exit /b 1)
          type "%RUNNER_TEMP%\bar.txt"
          findstr /c:"Gemini" "%RUNNER_TEMP%\bar.txt" > nul || (echo The bar did not render & exit /b 1)
          for %%f in ("%RUNNER_TEMP%\bar.err") do if %%~zf gtr 0 (type "%RUNNER_TEMP%\bar.err" & exit /b 1)

      - name: Verify diagnostics doctor command
        run: node src/index.js doctor --markdown

      - name: Verify bug report command
        run: node src/index.js report

      # Same as release.yml: the repo-only "prepare" script is removed before
      # packing, so the published package has no install scripts. npm always
      # packs every README, so the translations (README.<lang>.md) ship too.
      - name: Verify published package
        shell: bash
        run: |
          npm pkg delete scripts.prepare
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const bad = files.filter((f) => !/^(src\/|README(\.[a-z]{2}(-[A-Z]{2})?)?\.md$|CHANGELOG\.md$|LICENSE$|package\.json$)/.test(f));
            if (bad.length) throw new Error('Unexpected files in package: ' + bad.join(', '));
            const scripts = require('./package.json').scripts || {};
            const hooks = ['preinstall', 'install', 'postinstall', 'prepare'].filter((s) => s in scripts);
            if (hooks.length) throw new Error('Install scripts in package: ' + hooks.join(', '));
            console.log(files.length + ' files OK, no install scripts');
          "

  gallery:
    name: Theme preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Build gallery.html
        run: npm run gallery

      - name: Build theme screenshots
        run: npm run screenshots

      # Reviewers download "theme-preview" from the run's Summary page and
      # open gallery.html, or one SVG per theme in screenshots/, to see widget
      # and theme changes without installing.
      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-preview
          path: |
            gallery.html
            screenshots/
          retention-days: 14
