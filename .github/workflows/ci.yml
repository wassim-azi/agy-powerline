name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Verify zero runtime dependencies
        run: |
          node -e "
            const deps = Object.keys(require('./package.json').dependencies || {});
            if (deps.length) throw new Error('Runtime dependencies are not allowed: ' + deps.join(', '));
          "

      - name: Run shared cross-platform tests
        run: npm run test:shared

      - name: Run OS-specific native tests
        run: npm run test:platform

      - name: Verify diagnostics doctor command
        run: node src/index.js doctor --markdown

      - name: Verify bug report command
        run: node src/index.js report

      - name: Verify published file list
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const bad = files.filter((f) => !/^(src\/|README\.md$|CHANGELOG\.md$|LICENSE$|package\.json$)/.test(f));
            if (bad.length) throw new Error('Unexpected files in package: ' + bad.join(', '));
            console.log(files.length + ' files OK');
          "

  gallery:
    name: Theme preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Build gallery.html
        run: npm run gallery

      # Reviewers download "theme-preview" from the run's Summary page and
      # open gallery.html to see widget and theme changes without installing.
      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-preview
          path: gallery.html
          retention-days: 14
