name: Links

# Checks the links in the Markdown files. Pull requests and pushes check only
# the repo's own files and #anchors (offline), so a slow or rate-limiting site
# can't fail them; the weekly run also checks every outside link, which rots
# without any commit. .lycheeignore lists the pages that refuse link checkers.
on:
  push:
    branches: [main]
    paths: ["**.md", ".lycheeignore", ".github/workflows/links.yml"]
  pull_request:
    branches: [main]
    paths: ["**.md", ".lycheeignore", ".github/workflows/links.yml"]
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repo files and anchors
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --offline --include-fragments './**/*.md'

      # The token only lifts GitHub's rate limit for github.com links.
      - name: All links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --include-fragments --max-retries 3 './**/*.md'
          token: ${{ github.token }}
