name: Release

# Publishes to npm when a GitHub release is published from a tag on main.
# This is the only way a version reaches npm or any other platform. Uses npm trusted
# publishing (OIDC): no long-lived npm token is stored in the repo, and the
# package gets a provenance attestation linking it to this workflow run.
# The same tarball, with a signed GitHub attestation, is attached to the release.
on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Create this environment in GitHub (Settings > Environments) with
    # required reviewers so every publish needs a manual approval.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for trusted publishing, provenance and the attestation
      attestations: write # stores the tarball's attestation on GitHub
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, to check the tag is on main

      # Releases are cut from main only. A tag on develop or any other branch
      # is refused before anything is published.
      - name: Check the release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release tag points to a commit that is not on main. Merge develop into main first, then tag main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          # A cache restored from another run could leak into the published
          # package; the release always installs from scratch.
          package-manager-cache: false

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # "prepare" only turns on git hooks in a clone of the repo. Leave it out
      # of the published package so installs carry no install script (npm warns
      # about those). CI runs the same command before checking the package.
      - name: Remove repo-only scripts
        run: npm pkg delete scripts.prepare

      # Packed once, so the file on npm and the file on the GitHub release are
      # the same bytes.
      - name: Pack the tarball
        id: pack
        run: |
          TARBALL="$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.tgz'")"
          npm pack
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Signed with Sigstore through GitHub's OIDC identity. Done before the
      # publish, so a version never reaches npm without its attestation.
      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Name the attestation bundle after the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$TARBALL.sigstore.json"

      # Authenticates with npm trusted publishing (OIDC, configured on
      # npmjs.com for this workflow and environment): no npm token exists.
      # Needs npm 11.5.1 or later, which Node 24 ships with.
      - name: Publish with provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public

      - name: Keep the tarball and its attestation for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  # A separate job holds the only write access to the repository, so the job
  # that runs npm and the tests can't change releases.
  attach:
    name: Attach to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads files to the release

    steps:
      - name: Download the tarball and its attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Upload them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          TARBALL: ${{ needs.publish.outputs.tarball }}
        run: |
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
