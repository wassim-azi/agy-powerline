name: Pages

# Publishes agy-powerline.com to GitHub Pages: the theme gallery, the
# configurator, the docs and guides (scripts/site/build.js). It deploys when a
# release is published, from that release's tag, so the site always shows the
# released version; a manual run from a v* tag redeploys that release, and a
# run from anywhere else builds but doesn't deploy. After a deploy, the pages
# are announced to IndexNow so search engines that use it see changes sooner.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push waits instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: each page's "Updated" date and sitemap lastmod come
          # from the last commit that changed its source.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # The pages use only the repo's own code, so nothing is installed.
      - name: Build the site
        run: node scripts/site/build.js _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # Without it the action leaves out dot folders: .well-known/security.txt.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # IndexNow (Bing, Yandex, Naver, Seznam...) takes a list of changed URLs. The
  # key is public by design: the site serves it at /<key>.txt to prove the
  # announcement comes from the site's owner (INDEXNOW_KEY in
  # scripts/site/build.js). It sends every URL of the live sitemap; a failure
  # here doesn't undo the deploy.
  indexnow:
    name: Announce pages to IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    continue-on-error: true
    steps:
      - name: Send the sitemap's URLs
        env:
          SITE: https://agy-powerline.com
          KEY: fd008e145d1b3bc2d63c1ee54ac91e80
        run: |
          curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' > urls.txt
          jq -nR --arg host "${SITE#https://}" --arg key "$KEY" --arg keyLocation "$SITE/$KEY.txt"             '{host: $host, key: $key, keyLocation: $keyLocation, urlList: [inputs]}' < urls.txt > body.json
          echo "Announcing $(wc -l < urls.txt) URLs"
          curl -fsS -X POST https://api.indexnow.org/indexnow             -H 'Content-Type: application/json; charset=utf-8' --data @body.json
