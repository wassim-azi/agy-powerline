name: Labels

# Labels pull requests from the rules in .github/labeler.yml.
# pull_request_target so fork PRs can be labeled too: it runs this file as it
# is on main, with a token that can write labels. Nothing from the PR is
# checked out or run; the labeler only reads the list of changed files.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR code is never checked out
    types: [opened, synchronize, reopened]

permissions: {}

# A newer push to the same pull request relabels it, so the older run can stop.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # adds and removes the pull request's labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
