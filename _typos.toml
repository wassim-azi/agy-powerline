# typos (https://github.com/crate-ci/typos) checks English only, so it skips
# the translated READMEs and site scripts, where French site text looks like typos.
[files]
extend-exclude = ["README.*.md", "scripts/site/**"]

[default.extend-identifiers]
# The Nerd Font code point of a Powerline cap, which typos would read as "BA".
E0BA = "E0BA"
e0ba = "e0ba"

[default.extend-words]
# A correct spelling, used in code, docs and tests.
unparseable = "unparseable"
# A test cuts "middleware" short on purpose.
middlewar = "middlewar"
